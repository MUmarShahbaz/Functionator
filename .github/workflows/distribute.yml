name: Distribute

on:
    push:
        tags:
            - v*-source

jobs:
    build:
        name: Build Distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                node-version: 24.13.0

            - name: Install Dependencies
              run: |
                sudo apt-get update
                npm install

            - name: Build Distribution
              run: npm run prod

            - name: Upload build
              uses: actions/upload-artifact@v7
              with:
                name: dist
                path: ./dist
                if-no-files-found: error

    upload:
        name: Upload to branch
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
              with:
                ref: dist

            - name: Log in as Action Bot
              run: |
                git config user.name  "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Clean Branch
              run: find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

            - name: Download fresh build
              uses: actions/download-artifact@v7
              with:
                name: dist

            - name: Get Version
              id: var
              run: echo "version=${GITHUB_REF_NAME%-source}" >> $GITHUB_OUTPUT

            - name: Push
              run: |
                git add .
                git commit -m "Deployed from ${{ steps.var.outputs.version }}"
                git tag ${{ steps.var.outputs.version }}
                git push
                git push origin ${{ steps.var.outputs.version }}
    
    release:
        name: Publish Release
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6

            - name: Download fresh build
              uses: actions/download-artifact@v7
              with:
                name: dist

            - name: Get Version
              id: var
              run: echo "version=${GITHUB_REF_NAME%-source}" >> $GITHUB_OUTPUT

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                name: Functionator ${{ steps.var.outputs.version }}
                files: functionator.min.js
                tag_name: ${{ steps.var.outputs.version }}
                generate_release_notes: true
